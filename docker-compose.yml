# Arkamap stack: docker compose up --build, then open http://localhost:8000/docs
# Defaults are for local evaluation only; set real secrets in .env before exposing it.
name: arkamap

x-backend: &backend
  build: ./backend
  env_file: [{ path: .env, required: false }]
  environment:
    DATABASE_URL: postgresql://arkamap:${POSTGRES_PASSWORD:-arkamap}@db:5432/arkamap
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    REQUIRE_API_KEY: ${REQUIRE_API_KEY:-0}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    MQTT_HOST: mosquitto
    MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:-dev-bridge-password}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: arkamap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkamap}
      POSTGRES_DB: arkamap
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkamap -d arkamap"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Device registration provisions broker credentials, so the API needs it running.
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    environment:
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:-dev-bridge-password}
    ports: ["1883:1883"]
    volumes: ["./mosquitto:/mosquitto/config:ro", "mosquitto_data:/mosquitto/data"]
    command: ["sh", "/mosquitto/config/start.sh"]
    restart: unless-stopped

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      mosquitto: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: downloads public datasets into an empty database, then exits.
  seed:
    <<: *backend
    command: ["python", "seed.py"]
    depends_on:
      api: { condition: service_healthy }
    restart: "no"

volumes:
  pgdata:
  mosquitto_data:
