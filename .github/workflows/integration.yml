name: Integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: arkamap
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: arkamap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkamap -d arkamap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arkamap:ci-only@127.0.0.1:5432/arkamap_test
      JWT_SECRET: ci-only-secret
      ENABLE_SCHEDULER: "0"
      ENABLE_BUILDINGS_PREWARM: "0"
      MQTT_ENABLED: "0"
      REQUIRE_API_KEY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend

      # openapi.json and the generated TypeScript types match the backend code
      - run: npm run api:check
        working-directory: frontend
      - run: npm run test:api
        working-directory: frontend

      - name: Backend imports
        run: python -c "import app.main"
        working-directory: backend
      - name: Backend tests
        working-directory: backend
        run: |
          python test_iot.py
          python test_agent.py
          python test_bmkg.py
          python test_fire.py
          python test_paths.py
          python test_responder.py
