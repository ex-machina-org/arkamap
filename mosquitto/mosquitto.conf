# MQTT broker for sensor data. Every client must log in: devices with
# username dev<id> + their API key as password, the backend as "admin".
# Credentials and ACLs live in the Dynamic Security plugin's file (managed
# by the backend, see backend/app/iot/broker.py). Devices may only publish
# to ingest/<their username>; nothing else is allowed.

per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

listener 1883
listener 9001
protocol websockets

max_packet_size 20000
persistence false
log_dest stdout
